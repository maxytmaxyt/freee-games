name: Bundle → all.js

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.js'
      - 'index.js'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: all.js zusammenbauen
        run: node .github/scripts/bundle.mjs

      - name: all.js committen & pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen – kein Commit nötig."
          else
            git commit -m "build: all.js automatisch gebündelt [skip ci]"
            git push
          fi
